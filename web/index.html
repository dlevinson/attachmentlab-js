<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>General Attachment Lab</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        background:
          radial-gradient(circle at top left, rgba(11, 79, 108, 0.08), transparent 32%),
          linear-gradient(180deg, #f6f8fb 0%, #edf1f6 100%);
        color: #101828;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: transparent; }
      button, input, select, textarea { font: inherit; }
      button {
        border: 1px solid #98a2b3;
        background: #ffffff;
        color: #101828;
        border-radius: 10px;
        padding: 0.55rem 0.9rem;
        cursor: pointer;
      }
      button:hover { background: #f8fafc; }
      input, select, textarea {
        width: 100%;
        border: 1px solid #d0d5dd;
        border-radius: 10px;
        padding: 0.55rem 0.65rem;
        background: #ffffff;
      }

      .app-shell { padding: 1.2rem; }
      .app-shell--paper { background: #ffffff; }
      .card {
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(208, 213, 221, 0.95);
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(16, 24, 40, 0.08);
      }
      .app-header, .panel { padding: 1rem; }
      .app-header {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        align-items: flex-start;
        margin-bottom: 1rem;
      }
      .app-header h1 { margin: 0; font-size: 2rem; font-weight: 600; }
      .app-header p { margin: 0.4rem 0 0; color: #475467; max-width: 60rem; }
      .control-row, .tab-bar, .primary-tabs, .network-toolbar {
        display: flex;
        gap: 0.55rem;
        flex-wrap: wrap;
      }
      .primary-tabs { margin-bottom: 1rem; }
      .primary-tabs button.active, .tab-bar button.active {
        background: #0b4f6c;
        border-color: #0b4f6c;
        color: #ffffff;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(260px, 300px) minmax(0, 1.7fr) minmax(280px, 340px);
        gap: 1rem;
      }
      .center-column, .right-column { display: grid; gap: 1rem; }
      .panel__header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.8rem;
      }
      .panel__header-actions {
        display: flex;
        align-items: center;
        gap: 0.45rem;
      }
      .panel__header h2, .panel__header h3 { margin: 0; font-size: 1.1rem; }
      .panel-toggle {
        width: 2rem;
        min-width: 2rem;
        padding: 0.3rem 0;
        border-radius: 999px;
        font-size: 0.8rem;
        line-height: 1;
      }
      .panel__hint { margin: 0.35rem 0 0; color: #475467; font-size: 0.94rem; }
      .field { display: grid; gap: 0.35rem; margin-bottom: 0.75rem; }
      .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
      .field-grid--tight { gap: 0.45rem; }
      .field--compact { margin-bottom: 0.55rem; }
      .field--compact span { font-size: 0.84rem; color: #475467; }
      .field--compact input,
      .field--compact select,
      .field--compact textarea { padding: 0.45rem 0.55rem; }
      .field--disabled span { color: #98a2b3; }
      .field--disabled input,
      .field--disabled select,
      .field--disabled textarea {
        background: #f2f4f7;
        color: #98a2b3;
        border-color: #eaecf0;
        cursor: not-allowed;
      }
      .sidebar-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.45rem;
        margin-bottom: 0.75rem;
        position: sticky;
        top: 0;
        z-index: 4;
        padding: 0.1rem 0 0.55rem;
        background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(255,255,255,0.92) 100%);
      }
      .sidebar-actions button { padding: 0.5rem 0.65rem; }
      .sidebar-section {
        margin-bottom: 0.7rem;
        border: 1px solid #eaecf0;
        border-radius: 12px;
        background: #fcfcfd;
      }
      .sidebar-section summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
        padding: 0.7rem 0.8rem;
        cursor: pointer;
        list-style: none;
        font-weight: 600;
        color: #344054;
      }
      .sidebar-section summary::-webkit-details-marker { display: none; }
      .sidebar-section summary::after {
        content: "▾";
        color: #667085;
        font-size: 0.95rem;
        line-height: 1;
      }
      .sidebar-section:not([open]) summary::after { content: "▸"; }
      .sidebar-section__body { padding: 0 0.8rem 0.8rem; }
      .sidebar-subpanel {
        margin: 0 0 0.65rem;
        padding: 0.7rem 0.75rem 0.75rem;
        border: 1px solid #eaecf0;
        border-radius: 12px;
        background: #ffffff;
      }
      .sidebar-subpanel:last-child { margin-bottom: 0; }
      .sidebar-subpanel__title {
        margin: 0 0 0.2rem;
        font-size: 0.9rem;
        font-weight: 700;
        color: #344054;
      }
      .sidebar-subpanel__hint {
        margin: 0 0 0.55rem;
        color: #667085;
        font-size: 0.8rem;
        line-height: 1.35;
      }
      .warning-list {
        background: #fff4ed;
        border: 1px solid #fecdca;
        border-radius: 12px;
        padding: 0.8rem;
        color: #9a3412;
      }
      .equation-card {
        margin-bottom: 0.85rem;
        background: #f8fafc;
        border: 1px solid #d0d5dd;
        border-radius: 14px;
      }
      .equation-card summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.85rem 0.9rem;
        cursor: pointer;
        list-style: none;
      }
      .equation-card summary::-webkit-details-marker { display: none; }
      .equation-card summary::after {
        content: "▾";
        color: #475467;
        font-size: 1rem;
        line-height: 1;
      }
      .equation-card:not([open]) summary::after { content: "▸"; }
      .equation-card h3 {
        margin: 0;
        font-size: 0.98rem;
      }
      .equation-body {
        padding: 0 0.9rem 0.85rem;
      }
      .equation-code {
        margin: 0.45rem 0 0.65rem;
        padding: 0.65rem 0.75rem;
        background: #ffffff;
        border: 1px solid #eaecf0;
        border-radius: 12px;
        font-family: "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 0.82rem;
        line-height: 1.5;
        overflow-x: auto;
      }
      .equation-list {
        display: grid;
        gap: 0.25rem;
        margin: 0;
        padding-left: 1rem;
        color: #475467;
        font-size: 0.88rem;
      }
      .equation-subtitle {
        margin: 0.2rem 0 0;
        color: #475467;
        font-size: 0.9rem;
      }
      .status-pill {
        padding: 0.32rem 0.6rem;
        border-radius: 999px;
        font-size: 0.82rem;
        text-transform: capitalize;
        background: #f2f4f7;
      }
      .status-pill.done { background: #ecfdf3; color: #027a48; }
      .status-pill.early_stopped { background: #fff1f3; color: #c01048; }
      .network-stage {
        position: relative;
        height: 580px;
        background: linear-gradient(180deg, #fcfcfd 0%, #f8fafc 100%);
        border: 1px solid #d0d5dd;
        border-radius: 14px;
        overflow: hidden;
      }
      .network-stage.paper { background: #ffffff; }
      #network-canvas {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
      }
      .network-choropleth {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .network-lattice-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .network-reference-overlay {
        position: absolute;
        inset: 0;
        z-index: 3;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .network-boundary {
        position: absolute;
        inset: 22px;
        border: 1px dashed rgba(11, 79, 108, 0.35);
        pointer-events: none;
        z-index: 4;
      }
      .network-tooltip {
        position: absolute;
        background: rgba(255, 255, 255, 0.97);
        border: 1px solid #d0d5dd;
        border-radius: 12px;
        padding: 0.6rem 0.75rem;
        box-shadow: 0 12px 28px rgba(16, 24, 40, 0.18);
        font-size: 0.82rem;
        line-height: 1.45;
        pointer-events: none;
        max-width: 220px;
        z-index: 5;
      }
      .network-footer { display: flex; gap: 1rem; margin-top: 0.75rem; color: #475467; font-size: 0.94rem; flex-wrap: wrap; }
      .network-legend {
        display: grid;
        gap: 0.45rem;
        margin-top: 0.75rem;
        padding: 0.75rem 0.85rem;
        background: #f8fafc;
        border: 1px solid #eaecf0;
        border-radius: 12px;
      }
      .legend-row {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        flex-wrap: wrap;
        font-size: 0.86rem;
        color: #475467;
      }
      .legend-label {
        min-width: 7.5rem;
        font-weight: 600;
        color: #344054;
      }
      .legend-swatch, .legend-node {
        display: inline-block;
        width: 0.95rem;
        height: 0.95rem;
        border-radius: 3px;
        border: 1px solid rgba(16, 24, 40, 0.18);
      }
      .legend-node {
        border-radius: 999px;
        background: #0b4f6c;
      }
      .legend-node.newest { border: 3px solid #f79009; background: #0b4f6c; }
      .legend-node.selected { border: 3px solid #12b76a; background: #0b4f6c; }
      .legend-node.lonely { border: 3px solid #667085; background: #d0d5dd; border-radius: 4px; }
      .legend-node.split { border: 3px solid #f79009; background: #0b4f6c; transform: rotate(45deg); border-radius: 2px; }
      .legend-gradient {
        width: 8rem;
        height: 0.85rem;
        border-radius: 999px;
        border: 1px solid rgba(16, 24, 40, 0.12);
      }
      .legend-bound { color: #667085; font-variant-numeric: tabular-nums; }
      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
      }
      .legend-edge {
        display: inline-block;
        width: 1.5rem;
        height: 0;
        border-top: 2px solid #98a2b3;
      }
      .legend-edge.split {
        border-top-color: #f79009;
        border-top-style: dashed;
      }
      .legend-edge.base { border-top-color: #98a2b3; }
      .metrics-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.8rem;
      }
      .metrics-grid dt { color: #667085; font-size: 0.84rem; }
      .metrics-grid dd { margin: 0.18rem 0 0; font-weight: 600; }
      .metrics-footer { margin-top: 1rem; color: #475467; font-size: 0.92rem; }
      .insight-list { margin: 0; padding-left: 1.1rem; display: grid; gap: 0.6rem; }
      .comparison-card {
        border: 1px solid #eaecf0;
        border-radius: 14px;
        padding: 0.9rem;
        background: #ffffff;
        margin-bottom: 0.8rem;
      }
      .comparison-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.6rem;
      }
      .comparison-grid dt { color: #667085; font-size: 0.82rem; }
      .comparison-grid dd { margin: 0.18rem 0 0; }
      .delta.up { color: #027a48; }
      .delta.down { color: #b42318; }
      .chart-frame__header {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 0.75rem;
      }
      .chart-frame__header h3 { margin: 0; }
      .chart-frame__header p { margin: 0.3rem 0 0; color: #475467; font-size: 0.92rem; }
      .chart-svg {
        width: 100%;
        height: auto;
        background: #ffffff;
        border: 1px solid #eaecf0;
        border-radius: 14px;
        display: block;
      }
      .progress-bar {
        height: 12px;
        background: #eaecf0;
        border-radius: 999px;
        overflow: hidden;
        margin: 0.8rem 0 1rem;
      }
      .progress-bar__fill {
        height: 100%;
        background: linear-gradient(90deg, #0b4f6c 0%, #2f855a 100%);
        width: 0%;
      }
      .batch-table-wrap { overflow-x: auto; }
      .batch-table { width: 100%; border-collapse: collapse; }
      .batch-table th, .batch-table td {
        text-align: left;
        padding: 0.6rem 0.7rem;
        border-bottom: 1px solid #eaecf0;
      }
      .candidate-table-wrap {
        overflow: auto;
        margin-top: 0.75rem;
        border: 1px solid #eaecf0;
        border-radius: 12px;
        background: #ffffff;
      }
      .candidate-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.82rem;
      }
      .candidate-table th,
      .candidate-table td {
        text-align: left;
        padding: 0.45rem 0.55rem;
        border-bottom: 1px solid #f2f4f7;
        white-space: nowrap;
      }
      .candidate-table thead th {
        position: sticky;
        top: 0;
        background: #f8fafc;
        z-index: 1;
      }
      .saved-list { display: grid; gap: 0.6rem; margin-top: 1rem; }
      .saved-list__item {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.65rem 0.8rem;
        background: #f8fafc;
        border-radius: 12px;
      }
      .paper-caption {
        width: 100%;
        min-height: 120px;
        border: 1px solid #d0d5dd;
        border-radius: 12px;
        padding: 0.75rem;
      }
      .note {
        color: #475467;
        font-size: 0.92rem;
      }
      .accessibility-copy {
        white-space: pre-wrap;
        line-height: 1.5;
        color: #344054;
        font-size: 0.92rem;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .hidden { display: none !important; }
      @media (max-width: 1220px) { .layout { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
      (function loadCurrentStandaloneBundle() {
        const script = document.createElement('script');
        const bust = `cb=${Date.now()}`;
        script.src = `./main.js?${bust}`;
        script.async = false;
        document.body.appendChild(script);
      }());
    </script>
  </body>
</html>
